name: Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build & publish (e.g. v0.1.00); empty = current ref'
        required: false

permissions:
  contents: write # create/update releases and upload APK assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain --no-daemon

      - name: Rename APK to canonical name
        id: apk
        run: |
          VN=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/GrandCouncil-v$VN.apk"
          echo "apk=app/build/outputs/apk/release/GrandCouncil-v$VN.apk" >> "$GITHUB_OUTPUT"

      - name: Determine release tag
        id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: ${{ steps.apk.outputs.apk }}
          overwrite_files: true
          fail_on_unmatched_files: true
